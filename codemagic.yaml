workflows:
  ios-release:
    name: MoneyBack iOS Release
    max_build_duration: 60
    environment:
      ios_signing:
        provisioning_profiles:
          - moneyback_appstore
        certificates:
          - leekcast_tw_dist_v3
      vars:
        BUNDLE_ID: com.moneyback.app
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
        APP_STORE_CONNECT_ISSUER_ID: 5b4d9000-41c4-470d-8f89-4154cb59bd33
        APP_STORE_CONNECT_KEY_IDENTIFIER: 9YR5628QVZ
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Disable Swift Package Manager
        script: flutter config --no-enable-swift-package-manager
      - name: Get Flutter packages
        script: flutter pub get
      - name: Pod install
        script: cd ios && pod install --repo-update
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.moneyback.app \
            --type IOS_APP_STORE \
            --issuer-id 5b4d9000-41c4-470d-8f89-4154cb59bd33 \
            --key-id 9YR5628QVZ \
            --private-key $APP_STORE_CONNECT_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles --xcode-project ios/Runner.xcodeproj
      - name: Build iOS release
        script: flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
